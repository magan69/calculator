<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="styles.css"
</head>
<body>
    <div id="calc">
        <input type="text" id="display" readonly>
         <div class="buttonContainer">
        <button class="button" onclick = "currentInput = ''; document.querySelector('#display').value = currentInput;" >c</button>
        <button class="button" onclick="currentInput = currentInput + '1'; document.querySelector('#display').value = currentInput;">1</button>
        <button class="button" onclick="currentInput = currentInput + '2'; document.querySelector('#display').value = currentInput;">2</button>
        <button class="button" onclick = "currentInput = currentInput + '+'; document.querySelector('#display').value = currentInput;" >+</button>
        <button class="button" onclick = "currentInput = currentInput + '3'; document.querySelector('#display').value = currentInput;">3</button>
        <button class="button" onclick="currentInput = currentInput + '4'; document.querySelector('#display').value = currentInput;">4</button>
        <button class="button" onclick="currentInput = currentInput + '-'"; document.querySelector('#display').value = currentInput;">-</button>
        <button class="button" onclick="currentInput = currentInput + '5'; document.querySelector('#display').value = currentInput;">5</button>
        <button class="button" onclick="currentInput = currentInput + '6'; document.querySelector('#display').value = currentInput;">6</button>
        <button class="button" onclick="currentInput = currentInput + '/'"; document.querySelector('#display').value = currentInput;">/</button>
        <button class="button" onclick="currentInput = currentInput + '7'; document.querySelector('#display').value = currentInput;">7</button>
        <button class="button" onclick="currentInput = currentInput + '8'; document.querySelector('#display').value = currentInput;">8</button>
        <button class="button" onclick="currentInput = currentInput + '*'"; document.querySelector('#display').value = currentInput;">*</button>
        <button class="button" onclick= "currentInput = eval(currentInput); document.querySelector('#display').value = currentInput;">=</button>
        <button class="button" onclick="currentInput = currentInput + '9'; document.querySelector('#display').value = currentInput;">9</button>
        <button class="button" onclick="currentInput = currentInput + '0'; document.querySelector('#display').value = currentInput;">0</button>
        <button class="button" onclick="currentInput = currentInput + '.'"; document.querySelector('#display').value = currentInput;">.</button>

         </div>
    </div>
    <script> 
        let currentInput = '';
        document.querySelector('#display').value = currentInput;
    </script>
</body>
</html>
